name: e2e-android
on: push

jobs:
  e2e-android:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v3

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 18.x

      - name: Install dependencies
        run: npm install

      - name: Setup Java
        uses: actions/setup-java@v3
        with:
          distribution: temurin
          java-version: 17

      - name: Run tests on emulator
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 30
          arch: x86
          profile: pixel_5
          target: google_apis
          disable-animations: true
          emulator-options: '-no-window -gpu swiftshader_indirect -no-boot-anim -accel off -no-snapshot'
          script: |
            adb wait-for-device
            adb shell getprop sys.boot_completed | grep 1
            sleep 30
            npx detox build --configuration android.emu.release
            npx detox test --configuration android.emu.release --headless --record-logs all
