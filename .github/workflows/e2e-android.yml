jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v3
      - name: Set up JDK 11
        uses: actions/setup-java@v3
        with:
          java-version: '11'
          distribution: 'temurin'
          cache: gradle
      - name: Setup Detox
        uses: wix/Detox/scripts/init-android-ci@main
      - name: Run Detox Tests
        run: |
          yarn install
          npx detox build-android
          npx detox test --configuration android.emu.debug --headless --record-logs failing --record-videos failing --take-screenshots failing
