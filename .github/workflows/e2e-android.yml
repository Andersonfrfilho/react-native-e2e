name: e2e-android
on: push

jobs:
  e2e-android:
    runs-on: macos-13

    steps:
      - name: Checkout repository
        uses: actions/checkout@v3

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 18.x
          cache: npm

      - name: Install dependencies
        run: npm install --frozen-lockfile --prefer-offline

      - name: Setup Java
        uses: actions/setup-java@v3
        with:
          distribution: temurin
          java-version: 17
          cache: gradle

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3
        with:
          cmdline-tools-version: latest

      - name: Install latest emulator
        run: |
          echo "y" | sdkmanager --install "emulator" --channel=0
          sdkmanager --list | grep emulator

      - name: Cache AVD
        id: avd-cache
        uses: actions/cache@v3
        with:
          path: |
            ~/.android/avd/*
            ~/.android/adb*
          key: avd-${{ runner.os }}-api30-x86

      - name: Create AVD and generate snapshot
        if: steps.avd-cache.outputs.cache-hit != 'true'
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 30
          arch: x86
          profile: pixel_3a
          target: google_apis
          avd-name: Pixel_3a_API_30_x86
          emulator-options: -no-window -gpu swiftshader_indirect -noaudio -no-boot-anim -memory 6144 -cores 2
          disable-animations: true
          script: |
            adb kill-server
            adb start-server
            adb wait-for-device
            timeout 900 adb shell getprop sys.boot_completed | grep -m 1 '1' || {
              echo "Emulator failed to boot within 900 seconds"
              exit 1
            }
            echo "Generated AVD snapshot for caching."

      - name: Run tests on emulator
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 30
          arch: x86
          profile: pixel_3a
          target: google_apis
          avd-name: Pixel_3a_API_30_x86
          emulator-options: -no-snapshot-save -no-window -gpu swiftshader_indirect -noaudio -no-boot-anim -memory 6144 -cores 2
          disable-animations: true
          emulator-boot-timeout: 1200
          script: |
            adb kill-server
            adb start-server
            adb wait-for-device
            timeout 1200 adb shell getprop sys.boot_completed | grep -m 1 '1' || {
              echo "Emulator failed to boot within 1200 seconds"
              exit 1
            }
            adb logcat -c
            adb logcat *:E > logcat.log 2>&1 &
            npx detox build --configuration android.emu.release
            npx detox test --configuration android.emu.release --headless --record-logs all --max-workers 1 --logcat || {
              echo "Retrying Detox tests..."
              npx detox test --configuration android.emu.release --headless --record-logs all --max-workers 1 --logcat
            }

      - name: Upload test artifacts
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: test-reports
          path: |
            **/build/reports/**
            **/detox.log
            **/logcat.log
